# Conference badge - 90 x 55 mm at 96 dpi
# 1 attendee   2 role and organisation   3 personal QR   4 event mark
# This one has NO container border: stroke_frame = 0 with a blue bg_color on [0] gives a card
# printed on coloured stock, which is what a badge really looks like, and the text is set
# light against it. The corners are rounded by radius_box, which every box inherits.
# The colour stops half a cell in from the edge, because that is where the container box
# begins - on a real card that white edge is where the guillotine goes.
# The name is set in Dancing Script, a file kept beside this template. A font given as a FILE is
# measured from that file and travels with the label - embedded in the page and in the standalone
# .svg - so the card looks the same on a machine that has never heard of it. It is licensed under
# the SIL Open Font License 1.1 and the licence text sits next to it in DancingScript-OFL.txt,
# which is what the OFL asks of anyone who passes the font on.
# NB the two text boxes are separated by a blank row on purpose: two boxes with the SAME
# span and no gap between them form a further rectangle, which would be drawn as an empty
# field.
 +---------------------------------+
 | +-------------------+  +------+ |
 | |1                  |  |4     | |
 | |                   |  |      | |
 | +-------------------+  |      | |
 |                        |      | |
 | +-------------------+  |      | |
 | |2                  |  +------+ |
 | |                   |           |
 | +-------------------+  +------+ |
 |                        |3     | |
 |                        |      | |
 |                        |      | |
 |                        +------+ |
 +---------------------------------+

# Configuration

[0]
char_width = 10
char_height = 14
stroke_frame = 0
radius_box = 12
stroke_point = 4
csv_file = data.csv
out_name = labels
svg_output = 1
font = Arial
align = left
fg_color = #F0F4F8
bg_color = #111184

[1]
type = text
align = left
stroke = 0
font = DancingScript-Regular.otf

[2]
type = text
align = right
stroke = 0
fg_color = #486581
bg_color = #F0F4F8
radius = 5

[3]
type = code
format = qr
qr_correction = medium
font = courier
font_size = 7
stroke = 0
quiet_zone = 1

[4]
type = image
stroke = 0
