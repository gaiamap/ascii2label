# Event ticket - 180 x 70 mm at 96 dpi
# 4 event mark   1 event   2 seat and date   3 entry QR
# The vertical run of '|' between two '+' is the perforation: it stops one row inside the
# outer frame, because a line that spans a rectangle from side to side DELETES it creating two new adjacent boxes.
# The lone '+' at the lower right is the punch mark.
 +---------------------------------------------+
 | +-----+ +------------------+  +  +--------+ |
 | |4    | |1                 |  |  |3       | |
 | |     | |                  |  |  |        | |
 | |     | +------------------+  |  |        | |
 | |     |                       |  |        | |
 | |     | +------------------+  |  |        | |
 | +-----+ |2                 |  |  +--------+ |
 |         +------------------+  +             |
 |                                           + |
 +---------------------------------------------+

